version: "3.9"

x-service-base: &service-base
  build:
    context: ../..
    dockerfile: services/service/Dockerfile
  networks:
    - fusion
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  environment:
    &service-env
    DATABASE_URL: postgres://fusion:fusion@postgres:5432/fusion?sslmode=disable
    REDIS_URL: redis://redis:6379/0
    ALLOWED_ORIGINS: "*"

services:
  # ===== Infrastructure =====
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fusion
      POSTGRES_PASSWORD: fusion
      POSTGRES_DB: fusion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fusion"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fusion

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - fusion

  # ===== Media Server (RTMP ingest) =====
  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "1935:1935"    # RTMP
      - "8888:8888"    # HLS
      - "8889:8889"    # WebRTC
      - "9997:9997"    # Web API
    volumes:
      - ./mtx/mediamtx.yml:/mediamtx.yml
      - hlsdata:/recordings
    networks:
      - fusion
    depends_on:
      redis:
        condition: service_started

  # ===== Fusion Platform Services =====
  auth:
    <<: *service-base
    build:
      context: ../..
      dockerfile: services/auth/Dockerfile
    ports:
      - "8081:8080"
    environment:
      <<: *service-env
      PORT: "8080"
      JWT_SECRET: "dev-jwt-secret-change-in-production"
      REDIS_PREFIX: "auth"

  video:
    <<: *service-base
    build:
      context: ../..
      dockerfile: services/video/Dockerfile
    ports:
      - "8082:8080"
    environment:
      <<: *service-env
      PORT: "8080"
      STORAGE_ENDPOINT: ""
      STORAGE_REGION: "auto"
      TRANSCODE_PROVIDER: "cloudflare"

  chat:
    <<: *service-base
    build:
      context: ../..
      dockerfile: services/chat/Dockerfile
    ports:
      - "8083:8080"
    environment:
      <<: *service-env
      PORT: "8080"
      REDIS_PREFIX: "chat"

  payment:
    <<: *service-base
    build:
      context: ../..
      dockerfile: services/payment/Dockerfile
    ports:
      - "8084:8080"
    environment:
      <<: *service-env
      PORT: "8080"
      PADDLE_ENV: "sandbox"
      PAYPAL_ENV: "sandbox"
      PAYOUT_THRESHOLD: "50"
      PLATFORM_FEE_PCT: "10"

  stream:
    <<: *service-base
    build:
      context: ../..
      dockerfile: services/stream/Dockerfile
    ports:
      - "8085:8080"
    environment:
      <<: *service-env
      PORT: "8080"
      RTMP_LISTEN: ":1935"
      MEDIAMTX_API: "http://mediamtx:9997"
      SIMULCAST_ENABLED: "true"

  content:
    <<: *service-base
    build:
      context: ../..
      dockerfile: services/content/Dockerfile
    ports:
      - "8086:8080"
    environment:
      <<: *service-env
      PORT: "8080"

  notification:
    <<: *service-base
    build:
      context: ../..
      dockerfile: services/notification/Dockerfile
    ports:
      - "8087:8080"
    environment:
      <<: *service-env
      PORT: "8080"

  # ===== Edge / Reverse Proxy =====
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - fusion
    depends_on:
      - auth
      - video
      - chat
      - payment
      - stream
      - content
      - notification

volumes:
  pgdata:
  redisdata:
  hlsdata:

networks:
  fusion:
    driver: bridge