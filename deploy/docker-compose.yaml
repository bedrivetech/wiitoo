version: "3.9"

services:
  # ===== Infrastructure =====
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wiitoo
      POSTGRES_PASSWORD: wiitoo_change_me
      POSTGRES_DB: wiitoo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiitoo"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wiitoo

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - wiitoo

  # ===== Media Server (RTMP ingest) =====
  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "1935:1935"    # RTMP
      - "8888:8888"    # HLS
      - "8889:8889"    # WebRTC
      - "9997:9997"    # Web API
    volumes:
      - ./mtx/mediamtx.yml:/mediamtx.yml
      - hlsdata:/recordings
    networks:
      - wiitoo
    depends_on:
      redis:
        condition: service_started

  # ===== Wiitoo Monolith API =====
  wiitoo-api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://wiitoo:wiitoo_change_me@postgres:5432/wiitoo?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: "*"
      PORT: "8080"
      # Auth config
      JWT_SECRET: "dev-jwt-secret-change-in-production"
      REDIS_PREFIX: "auth"
      # Video config
      STORAGE_ENDPOINT: ""
      STORAGE_REGION: "auto"
      VIDEO_PROVIDER: "cloudflare"
      # Payment config
      PADDLE_ENV: "sandbox"
      PAYPAL_ENV: "sandbox"
      PAYOUT_THRESHOLD: "50"
      PLATFORM_FEE_PCT: "10"
      # Stream config
      RTMP_LISTEN: ":1935"
      MEDIAMTX_API: "http://mediamtx:9997"
      SIMULCAST_ENABLED: "true"
    networks:
      - wiitoo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # ===== Edge / Reverse Proxy =====
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - wiitoo
    depends_on:
      - wiitoo-api

volumes:
  pgdata:
  redisdata:
  hlsdata:

networks:
  wiitoo:
    driver: bridge